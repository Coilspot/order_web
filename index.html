<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業點餐系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .dish-row { display: flex; align-items: center; margin-bottom: 10px; }
        .dish-name { flex-grow: 1; }
        .dish-qty { width: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="mb-4">餐點選擇</h3>
    <form id="orderForm">
        <div class="mb-3">
            <label>選擇方案：</label>
            <select id="mealType" class="form-select" onchange="updateDropdowns()">
                <option value="1">單點</option>
                <option value="2">雙拼</option>
                <option value="3">三拼</option>
                <option value="4">四拼</option>
            </select>
        </div>

        <div id="dropdownContainer" class="mb-3"></div>

        <div class="mb-3">
            <label>升級方案：</label>
            <select name="upgrade" class="form-select">
                <option value="不升級">不升級</option>
                <option value="蛋+冷泡茶">蛋+冷泡茶</option>
                <option value="冷泡茶">冷泡茶</option>
            </select>
        </div>

        <hr>
        <h5>單點列表：</h5>
        <div id="sideList"></div>

        <button type="submit" class="btn btn-primary w-100 mt-3">送出訂單</button>
    </form>
</div>

<script>
    const dishes = ["大雞腿便當", "排骨便當", "浦燒鯛魚便當", "超大雞排便當", "滷雞腿便當", "鯖魚便當", "雞排便當", "蝦排便當"];
    const sideItems = ["美式超大雞排", "蒜大雞腿", "排骨", "鯖魚", "雞排", "蝦排", "荷包蛋", "滷蛋", "白飯", "冷泡茶"];

    // 產生選單
    function updateDropdowns() {
        const count = document.getElementById('mealType').value;
        const container = document.getElementById('dropdownContainer');
        container.innerHTML = '';
        for(let i=0; i<count; i++) {
            let select = `<select name="mainMeal" class="form-select mb-2 main-select" onchange="checkDuplicates()">
                            <option value="">-- 請選擇主餐 ${i+1} --</option>
                            ${dishes.map(d => `<option value="${d}">${d}</option>`).join('')}
                          </select>`;
            container.innerHTML += select;
        }
    }

    // 防重複邏輯
    function checkDuplicates() {
        const selects = document.querySelectorAll('.main-select');
        const values = Array.from(selects).map(s => s.value).filter(v => v !== "");
        const unique = new Set(values);
        if (values.length !== unique.size) {
            alert("主餐內容不可重複！");
            event.target.value = "";
        }
    }

    // 初始化單點列表
    const sideDiv = document.getElementById('sideList');
    sideItems.forEach(item => {
        sideDiv.innerHTML += `
            <div class="dish-row">
                <span class="dish-name">${item}</span>
                <input type="number" name="qty_${item}" class="form-control dish-qty" value="0" min="0">
            </div>`;
    });

    // 初次載入
    updateDropdowns();
</script>
</body>
</html>
