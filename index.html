<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上點餐系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dish-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .dish-qty { width: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="mb-4 text-center">餐點選擇</h3>
    <form id="orderForm">
        <div class="mb-3">
            <label class="form-label">選擇方案：</label>
            <select id="mealType" class="form-select" onchange="updateDropdowns()">
                <option value="1">單點</option>
                <option value="2">雙拼</option>
                <option value="3">三拼</option>
                <option value="4">四拼</option>
            </select>
        </div>

        <div id="dropdownContainer" class="mb-3"></div>

        <div class="mb-3">
            <label class="form-label">升級方案：</label>
            <select id="upgrade" class="form-select">
                <option value="不升級">不升級</option>
                <option value="蛋+冷泡茶">蛋+冷泡茶</option>
                <option value="冷泡茶">冷泡茶</option>
            </select>
        </div>

        <hr>
        <h5>單點加購：</h5>
        <div id="sideList" class="mb-4"></div>

        <button type="submit" class="btn btn-success w-100 py-2">確認送出訂單</button>
    </form>
</div>

<script>
    const dishes = ["大雞腿便當", "排骨便當", "浦燒鯛魚便當", "超大雞排便當", "滷雞腿便當", "鯖魚便當", "雞排便當", "蝦排便當"];
    const sideItems = ["美式超大雞排", "蒜大雞腿", "排骨", "鯖魚", "雞排", "蝦排", "荷包蛋", "滷蛋", "白飯", "冷泡茶"];

    function updateDropdowns() {
        const count = document.getElementById('mealType').value;
        const container = document.getElementById('dropdownContainer');
        container.innerHTML = '<label class="form-label">主餐選擇：</label>';
        for(let i=0; i<count; i++) {
            container.innerHTML += `<select name="mainMeal" class="form-select mb-2 main-select" required onchange="checkDuplicates()">
                                        <option value="">-- 請選擇主餐 ${i+1} --</option>
                                        ${dishes.map(d => `<option value="${d}">${d}</option>`).join('')}
                                    </select>`;
        }
    }

    function checkDuplicates() {
        const selects = document.querySelectorAll('.main-select');
        const values = Array.from(selects).map(s => s.value).filter(v => v !== "");
        const unique = new Set(values);
        if (values.length !== unique.size) {
            alert("主餐內容不可重複！");
            event.target.value = "";
        }
    }

    // 初始化單點列表
    const sideDiv = document.getElementById('sideList');
    sideItems.forEach(item => {
        sideDiv.innerHTML += `
            <div class="dish-row">
                <span>${item}</span>
                <input type="number" name="qty_${item}" class="form-control dish-qty" value="0" min="0">
            </div>`;
    });

    updateDropdowns();

    // 送出訂單
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const mainMeals = Array.from(document.querySelectorAll('select[name="mainMeal"]')).map(s => s.value);
        const sidesQty = {};
        document.querySelectorAll('input[type="number"]').forEach(input => {
            if(input.value > 0) sidesQty[input.name.replace('qty_', '')] = input.value;
        });

        const data = {
            mealType: document.getElementById('mealType').options[document.getElementById('mealType').selectedIndex].text,
            mainMeals: mainMeals,
            upgrade: document.getElementById('upgrade').value,
            sidesQty: sidesQty
        };

        // 請在此處替換你的 Google Apps Script 網址
        const scriptUrl = 'YOUR_WEB_APP_URL_HERE';

        fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(data)
        }).then(() => {
            alert('訂單已成功送出！');
            this.reset();
            updateDropdowns();
        }).catch(err => alert('送出失敗，請檢查網路連線。'));
    });
</script>
</body>
</html>
