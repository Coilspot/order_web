<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>點餐系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .combo-box { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <form id="orderForm">
        <div id="comboContainer">
            </div>
        <button type="button" class="btn btn-secondary mb-3" onclick="addCombo()">+ 新增組合</button>
        
        <hr>
        <h5>單點列表：</h5>
        <div id="sideList" class="mb-4"></div>
        <button type="submit" class="btn btn-primary w-100">送出訂單</button>
    </form>
</div>

<script>
    const menu = ["大雞腿", "排骨", "浦燒鯛魚", "超大雞排", "滷雞腿", "鯖魚", "雞排", "蝦排"];
    const sides = ["美式超大雞排", "蒜大雞腿", "排骨", "鯖魚", "雞排", "蝦排", "荷包蛋", "滷蛋", "白飯", "冷泡茶"];
    let comboCount = 0;

    function addCombo() {
        comboCount++;
        const div = document.createElement('div');
        div.className = 'combo-box';
        div.id = 'combo_' + comboCount;
        div.innerHTML = `
            <select class="form-select mb-2" onchange="updateDropdowns(${comboCount})" id="type_${comboCount}">
                <option value="1">單點</option><option value="2">雙拼</option>
                <option value="3">三拼</option><option value="4">四拼</option>
            </select>
            <div id="dropdowns_${comboCount}" class="d-flex flex-wrap gap-2"></div>
            <select class="form-select mt-2" id="upgrade_${comboCount}">
                <option value="不升級">不升級</option><option value="蛋+冷泡茶">蛋+冷泡茶</option><option value="冷泡茶">冷泡茶</option>
            </select>
            <button type="button" class="btn btn-danger btn-sm mt-2" onclick="document.getElementById('combo_${comboCount}').remove()">刪除此組合</button>
        `;
        document.getElementById('comboContainer').appendChild(div);
        updateDropdowns(comboCount);
    }

    function updateDropdowns(id) {
        const count = document.getElementById('type_' + id).value;
        const container = document.getElementById('dropdowns_' + id);
        container.innerHTML = '';
        for(let i=0; i<count; i++) {
            container.innerHTML += `<select class="form-select w-auto" onchange="checkDuplicates(this)"><option>${menu.join('</option><option>')}</option></select><span>便當</span>`;
        }
    }

    // 新增：防重複選擇檢查
    function checkDuplicates(selectElement) {
        const container = selectElement.parentElement;
        const selects = container.querySelectorAll('select.form-select.w-auto');
        const values = Array.from(selects).map(s => s.value);
        const unique = new Set(values);
        if (values.length !== unique.size) {
            alert("同一個超值組合內，主餐不可重複！");
            selectElement.value = menu[0]; // 發生重複時重置
        }
    }
    
    // 產生單點
    sides.forEach(s => {
        document.getElementById('sideList').innerHTML += `<div class="d-flex mb-1">${s} <input type="number" name="side_${s}" value="0" min="0" class="ms-auto w-25 form-control"></div>`;
    });

    document.getElementById('orderForm').onsubmit = async (e) => {
    e.preventDefault();
    const now = new Date();
    const orderId = now.getFullYear().toString() + (now.getMonth()+1).toString().padStart(2,'0') + now.getDate().toString().padStart(2,'0') + "_" + now.getHours().toString().padStart(2,'0') + now.getMinutes().toString().padStart(2,'0') + now.getSeconds().toString().padStart(2,'0');

    // 收集組合資料
    let combos = [];
    document.querySelectorAll('.combo-box').forEach(box => {
        let id = box.id.split('_')[1];
        let items = Array.from(box.querySelectorAll('select.form-select.w-auto')).map(s => s.value);
        combos.push({
            type: document.getElementById('type_' + id).value, // 1,2,3,4
            items: items,
            upgrade: document.getElementById('upgrade_' + id).value
        });
    });

    // 收集單點資料
    let sidesData = {};
    document.querySelectorAll('input[type="number"]').forEach(input => {
        if(input.value > 0) sidesData[input.name.replace('side_', '')] = input.value;
    });

    const data = { orderId, combos, sidesData };

    // 請替換你的 Web App URL
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbwxyo_n_hczMeGaNd059wuNF7EpNKU2gqJdI32plTmdmNOWz-w2WY6r_9jKDHNNZQla7A/exec';

    try {
        const response = await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(data)
        });
        alert('訂單號：' + orderId + ' 已送出！');
    } catch (err) {
        alert('送出失敗');
    }
};
    
    addCombo();
</script>
</body>
</html>
