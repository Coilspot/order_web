<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易點餐系統</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .section { margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>請點餐</h2>
    <form id="orderForm">
        <div class="section">
            <label>主餐選擇：</label><br>
            <select name="mainMeal" required>
                <option value="方案A">方案 A</option>
                <option value="方案B">方案 B</option>
                <option value="方案C">方案 C</option>
            </select>
        </div>

        <div class="section">
            <label>配菜 (最多選 3 個)：</label><br>
            <input type="checkbox" name="sides" value="青菜"> 青菜
            <input type="checkbox" name="sides" value="豆干"> 豆干
            <input type="checkbox" name="sides" value="滷蛋"> 滷蛋
            <input type="checkbox" name="sides" value="泡菜"> 泡菜
        </div>

        <div class="section">
            <label>升級方案 (最多選 2 個)：</label><br>
            <input type="checkbox" name="upgrade" value="加量"> 加量
            <input type="checkbox" name="upgrade" value="飲品"> 飲品
            <input type="checkbox" name="upgrade" value="湯品"> 湯品
        </div>

        <button type="submit">確認送出</button>
    </form>

    <script>
        // 限制選取數量
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const group = this.name;
                const checked = document.querySelectorAll(`input[name="${group}"]:checked`);
                const limit = (group === 'sides') ? 3 : 2;
                if (checked.length > limit) {
                    alert(`此項目最多只能選 ${limit} 個！`);
                    this.checked = false;
                }
            });
        });

        // 送出訂單
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = {
                mainMeal: formData.get('mainMeal'),
                sides: formData.getAll('sides'),
                upgrade: formData.getAll('upgrade')
            };

            // 這裡請替換成你的 Google Apps Script 部署網址
            const scriptUrl = 'https://script.google.com/macros/s/AKfycbwxyo_n_hczMeGaNd059wuNF7EpNKU2gqJdI32plTmdmNOWz-w2WY6r_9jKDHNNZQla7A/exec';

            fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).then(() => {
                alert('訂單已送出！');
                this.reset();
            });
        });
    </script>
</body>
</html>
