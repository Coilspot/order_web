<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>點餐系統 - 每日訂單明細</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --primary: #4f46e5;
      --border-color: #e5e7eb;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      padding-bottom: 50px;
    }

    .login-container { max-width: 400px; margin-top: 15vh; }
    .login-card {
      border: none; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      background-color: var(--card-bg); padding: 30px;
    }

    .dashboard-header {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.15);
    }

    .order-card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }
    
    .order-card-header {
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      border-radius: 12px 12px 0 0;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .order-card-body { padding: 20px; }
    
    .combo-section {
      background-color: #f1f5f9;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    
    .combo-title { font-weight: 600; color: #334155; margin-bottom: 6px; }
    .combo-items { margin-left: 15px; color: #475569; font-size: 0.95rem; }
    
    .side-section {
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
      margin-top: 12px;
    }
    
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.85); display: flex;
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; font-size: 1.2rem; font-weight: 600;
    }
    .spinner-border { width: 3rem; height: 3rem; color: #059669; }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="spinner-border mb-3" role="status"></div>
    <div id="loadingText">處理中...</div>
  </div>

  <div id="authContainer" class="container login-container">
    <div class="login-card text-center">
      <h3 class="fw-bold text-success mb-3">明細查詢登入</h3>
      <p class="text-muted mb-4">請輸入密碼以檢視每日訂單明細</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <input type="password" id="adminPassword" class="form-control form-control-lg text-center" placeholder="請輸入密碼" required autofocus>
          <div id="loginFeedback" class="invalid-feedback mt-2">密碼錯誤，請再試一次。</div>
        </div>
        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-2">登入</button>
      </form>
    </div>
  </div>

  <div id="dashboardContainer" class="container py-4" style="display: none;">
    <div class="dashboard-header d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <h2 class="m-0 fw-bold">每日訂單明細查詢</h2>
        <p class="m-0 opacity-75 mt-1">查閱特定日期的所有訂單詳細內容</p>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <label for="datePicker" class="fw-medium text-nowrap m-0 text-white">選擇日期：</label>
        <input type="date" id="datePicker" class="form-control" style="width: auto;">
        <button class="btn btn-light fw-bold text-success px-3" onclick="window.location.href='admin.html'">返回數據報表</button>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12 text-end">
        <h5 class="fw-bold text-secondary">當日總營業額: <span id="dailyTotalRevenue" class="text-success">$ 0</span> (共 <span id="dailyOrderCount">0</span> 筆)</h5>
      </div>
    </div>

    <div id="ordersContainer">
      <!-- 訂單卡片將動態插入此處 -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kunjdfvluaoyfszocfzb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_B_-aIszU8wV0RyFnXwid8g_BMc1OVv2';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('admin_logged_in') === 'true') {
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('dashboardContainer').style.display = 'block';
        initPage();
      }
    });

    function handleLogin(e) {
      e.preventDefault();
      const pwdInput = document.getElementById('adminPassword');
      const feedback = document.getElementById('loginFeedback');
      
      if (pwdInput.value === 'admin123') {
        sessionStorage.setItem('admin_logged_in', 'true');
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('dashboardContainer').style.display = 'block';
        initPage();
      } else {
        pwdInput.classList.add('is-invalid');
        feedback.style.display = 'block';
        pwdInput.value = '';
        pwdInput.focus();
      }
    }

    document.getElementById('adminPassword').addEventListener('input', function() {
      this.classList.remove('is-invalid');
      document.getElementById('loginFeedback').style.display = 'none';
    });

    function initPage() {
      const today = new Date();
      const curYear = today.getFullYear();
      const curMonth = String(today.getMonth() + 1).padStart(2, '0');
      const curDate = String(today.getDate()).padStart(2, '0');
      
      const datePicker = document.getElementById('datePicker');
      datePicker.value = `${curYear}-${curMonth}-${curDate}`;
      
      datePicker.addEventListener('change', loadDailyOrders);
      loadDailyOrders();
    }

    function toggleLoading(show) {
      document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    }

    async function loadDailyOrders() {
      const selectedDateStr = document.getElementById('datePicker').value;
      if (!selectedDateStr) return;
      
      toggleLoading(true);

      try {
        if (!supabaseClient) throw new Error("Supabase 客戶端尚未初始化");

        const [year, month, day] = selectedDateStr.split('-').map(Number);
        
        // 當地時間 00:00:00 到 隔天 00:00:00
        const startDate = new Date(year, month - 1, day, 0, 0, 0, 0);
        const endDate = new Date(year, month - 1, day + 1, 0, 0, 0, 0);

        const { data, error } = await supabaseClient
          .from('orders')
          .select(`
            id,
            total_price,
            created_at,
            combos (*),
            order_items (*)
          `)
          .gte('created_at', startDate.toISOString())
          .lt('created_at', endDate.toISOString())
          .order('created_at', { ascending: false });

        if (error) throw error;
        
        renderOrders(data);
      } catch (err) {
        console.error(err);
        alert("讀取訂單資料失敗！錯誤資訊: " + err.message);
      } finally {
        toggleLoading(false);
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '';
      
      let totalRevenue = 0;
      
      if (!orders || orders.length === 0) {
        container.innerHTML = '<div class="text-center text-muted py-5"><h5 class="fw-bold">查無該日期的訂單</h5></div>';
        document.getElementById('dailyTotalRevenue').innerText = '$ 0';
        document.getElementById('dailyOrderCount').innerText = '0';
        return;
      }

      orders.forEach(order => {
        totalRevenue += (order.total_price || 0);
        
        const dateObj = new Date(order.created_at);
        const timeStr = `${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;

        let itemsHtml = '';
        
        // 處理組合餐
        if (order.combos && order.combos.length > 0) {
          order.combos.forEach(combo => {
            const comboItems = (order.order_items || []).filter(item => item.combo_id === combo.id);
            const dishesStr = comboItems.map(i => i.menu_item).join(', ');
            
            itemsHtml += `
              <div class="combo-section">
                <div class="combo-title">📦 ${combo.combo_type} x ${combo.qty} <span class="badge bg-secondary ms-2">升級: ${combo.upgrade_name || '無'}</span></div>
                <div class="combo-items">包含：${dishesStr || '無項目'}</div>
              </div>
            `;
          });
        }
        
        // 處理單點 (無 combo_id)
        const sideItems = (order.order_items || []).filter(item => !item.combo_id);
        if (sideItems.length > 0) {
          itemsHtml += `<div class="side-section"><div class="fw-bold mb-2 text-dark">🍟 單點項目：</div>`;
          sideItems.forEach(side => {
            itemsHtml += `<div class="ms-3 mb-1 text-secondary">• ${side.menu_item} <span class="fw-bold text-dark">x ${side.qty}</span></div>`;
          });
          itemsHtml += `</div>`;
        }

        const card = document.createElement('div');
        card.className = 'card order-card';
        card.innerHTML = `
          <div class="order-card-header">
            <div>
              <span class="badge bg-primary fs-6 me-2">${timeStr}</span>
              <span class="text-muted fw-medium">單號: ${order.id}</span>
            </div>
            <h5 class="m-0 fw-bold text-danger">$ ${order.total_price}</h5>
          </div>
          <div class="order-card-body">
            ${itemsHtml || '<div class="text-muted">無明細內容</div>'}
          </div>
        `;
        
        container.appendChild(card);
      });

      document.getElementById('dailyTotalRevenue').innerText = `$ ${totalRevenue.toLocaleString()}`;
      document.getElementById('dailyOrderCount').innerText = orders.length;
    }
  </script>
</body>
</html>
